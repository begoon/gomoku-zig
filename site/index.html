<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Gomoku Game</title>
        <link rel="stylesheet" href="styles.css" />
    </head>
    <body>
        <label for="difficulty">Thinking time:</label>
        <select id="difficulty">
            <option value="250">Quick (0.25 seconds)</option>
            <option value="1000">Normal (1 second)</option>
            <option value="3000" selected>Deep (3 seconds)</option>
        </select>
        <div id="board" class="board"></div>
        <div id="status"></div>
        <div id="duration"></div>
        <div id="moves"></div>
    </body>
    <script src="script.js" defer></script>
</html>
