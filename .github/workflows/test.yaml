name: test
on:
    push:
        branches: ["main"]
    workflow_dispatch:
jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - uses: extractions/setup-just@v3
            - uses: mlugg/setup-zig@v2
              with:
                  version: 0.16.0
            - run: just test
            - run: zig build-exe -O ReleaseFast gomoku.zig
            - run: just wasm-build js-build
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
            - run: node scripts/wasm-smoke.mjs
